<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Chaos Dice Host Tool</title>
    <style>
        body {
            font-family: 'Trebuchet MS', sans-serif;
            background: linear-gradient(135deg, #0d1b2a, #1b263b);
            color: #e0e1dd;
            margin: 0;
            height: 100vh;
            display: grid;
            grid-template-columns: 250px 1fr 250px;
            grid-template-rows: auto 1fr auto;
            grid-template-areas: "header header header" "left main right" "footer footer footer";
        }
        
        header {
            grid-area: header;
            text-align: center;
            padding: 10px;
        }
        
        header h1 {
            color: #ffcc00;
            text-shadow: 2px 2px #000;
        }
        
        aside.left {
            grid-area: left;
            padding: 10px;
            background: #1b263b;
        }
        
        aside.right {
            grid-area: right;
            padding: 10px;
            background: #1b263b;
        }
        
        main {
            grid-area: main;
            padding: 10px;
            text-align: center;
        }
        
        footer {
            grid-area: footer;
            text-align: center;
            padding: 10px;
            background: #1b263b;
        }
        
        section {
            margin: 10px auto;
            background: rgba(27, 38, 59, 0.9);
            padding: 10px;
            border-radius: 8px;
        }
        
        h2 {
            color: #ffd60a;
            border-bottom: 2px solid #ffd60a;
            margin-bottom: 5px;
        }
        
        table {
            margin: 10px auto;
            border-collapse: collapse;
            width: 90%;
            background: #0d1b2a;
            border-radius: 8px;
            overflow: hidden;
        }
        
        th,
        td {
            border: 1px solid #e0e1dd;
            padding: 8px;
            text-align: center;
        }
        
        th {
            background: #415a77;
            color: #fff;
        }
        
        button {
            margin: 2px;
            padding: 6px 10px;
            background: #ffcc00;
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        
        button:hover {
            background: #ffd60a;
            transform: scale(1.05);
        }
        
        .eliminated {
            background: #6c757d !important;
            color: #ccc;
            text-decoration: line-through;
        }
        
        .activeTurn {
            background: #2d6a4f !important;
            color: #fff;
            font-weight: bold;
        }
        
        #timer {
            font-size: 18px;
            font-weight: bold;
            color: #ffcc00;
        }
    </style>


</head>

<body>
    <header>
        <h1>⚓ Chaos Dice Host Tool ⚓</h1>
    </header>

    <!-- Left Sidebar: Turn Order -->
    <section>
        <h2>Turn Order</h2>
        <div id="turnOrder">No players yet.</div>
        <button onclick="nextTurn()">Next Turn</button>

        <!-- Game Log below turn order -->
        <div id="gameLog" style="height:200px; overflow-y:auto; background:#0d1b2a; padding:10px; border-radius:8px; margin-top:10px;">
            <em>No events yet...</em>
        </div>
    </section>


    <!-- Main: Scoreboard -->
    <main>
        <section>
            <h2>Add Player</h2>
            <input type="text" id="newPlayer" placeholder="Enter name">
            <button onclick="addPlayer()">Add</button>
        </section>
        <section>
            <h2>Scoreboard</h2>
            <table id="scoreboard">
                <tr>
                    <th>Player</th>
                    <th>Hearts</th>
                    <th>Shield</th>
                    <th>Victory Points</th>
                    <th>Controls</th>
                </tr>
            </table>
        </section>
    </main>

    <!-- Right Sidebar: Effects -->
    <aside class="right">
        <section>
            <h2>Dice Effects</h2>
            <select id="targetPlayer"></select>
            <select id="targetPlayer2"></select>
            <div>
                <button onclick="cannonFire()">Roll 1 – Cannon Fire</button>
                <button onclick="drinkRum()">Roll 2 – Drink Rum</button>
                <button onclick="mutiny()">Roll 3 – Mutiny</button>
                <button onclick="shield()">Roll 4 – Shield</button>
                <button onclick="swapHearts()">Roll 5 – Swap</button>
            </div>
        </section>
        <section>
            <h2>Captain's Chaos</h2>
            <div>
                <button onclick="chaosHealAll()">Everyone +❤️</button>
                <button onclick="chaosDamageAll()">Everyone -❤️</button>
                <button onclick="chaosReverseOrder()">Reverse Order</button>
                <button onclick="chaosLowestRoll()">Lowest Roll -❤️</button>
                <button onclick="chaosSwapTwo()">Swap Two Hearts</button>
                <button onclick="chaosImmunity()">Global Immunity</button>
            </div>
        </section>
    </aside>

    <!-- Footer: Timer -->
    <footer>
        <h2>Turn Timer</h2>
        <label>Seconds: <input type="number" id="timerLength" value="30" min="5"></label>
        <button onclick="startTimer()">Start Turn</button>
        <div id="timer">Turn Timer: 30s</div>
    </footer>

    <!-- Script will go here -->
    <script src="chaosdice.js"></script>



</body>

</html>
